version: "3.1"

rules:

  # --- The "Glue" Rules ---
  - rule: Say hello whenever the user greets
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye whenever the user says bye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Challenge response (Turing Test)
    steps:
      - intent: bot_challenge
      - action: utter_bot_challenge

  # --- The "Safety" Rule (Crucial for Section 1.4 of your report) ---
  - rule: Detect Mental Health Crisis
    steps:
      - intent: detect_mental_health_crisis
      - action: utter_detect_mental_health_crisis

  # --- Database Actions (Custom Actions) ---
  - rule: Provide Course Prerequisites
    steps:
      - intent: ask_prerequisite
      - action: action_provide_prerequisite

  - rule: Provide Course Information
    steps:
      - intent: ask_course_info
      - action: action_provide_course_info

  # These ensure the bot NEVER forgets the policy answers
  
  - rule: Answer Deferment
    steps:
      - intent: ask_deferment
      - action: utter_ask_deferment

  - rule: Answer Change Program
    steps:
      - intent: ask_change_program
      - action: utter_ask_change_program

  - rule: Answer Fees Block
    steps:
      - intent: ask_fees_registration_block
      - action: utter_ask_fees_registration_block

  - rule: Answer System Issues
    steps:
      - intent: ask_system_issues
      - action: utter_ask_system_issues

  - rule: Answer Career Prospects
    steps:
      - intent: ask_career_prospects
      - action: utter_ask_career_prospects

  - rule: Answer Industrial Training
    steps:
      - intent: ask_industrial_training
      - action: utter_ask_industrial_training

  - rule: Answer Graduation Criteria
    steps:
      - intent: ask_graduation_criteria
      - action: utter_ask_graduation_criteria

  - rule: Answer Fail/Repeat Policy
    steps:
      - intent: ask_fail_repeat_policy
      - action: utter_ask_fail_repeat_policy

  - rule: Answer Probation Status
    steps:
      - intent: ask_probation_status
      - action: utter_ask_probation_status

  - rule: Answer MUET Requirement
    steps:
      - intent: ask_muet_requirement
      - action: utter_ask_muet_requirement

  # - rule: Answer Credit Overload
  #   steps:
