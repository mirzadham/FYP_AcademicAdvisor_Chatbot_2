entities:
  - course_code

slots:
  course_code:
    type: text
    mappings:
      - type: from_entity
        entity: course_code

responses:
  utter_greet:
  - text: "Hello! I am your UPM Academic Advisor Chatbot. How can I help you with your academic journey today?"
  - text: "Hi there. I can help with course info, deadlines, and regulations. What do you need?"

  utter_goodbye:
  - text: "Goodbye! Good luck with your studies."
  - text: "See you later. Don't hesitate to ask if you have more questions."

  utter_thank_you:
  - text: "You are welcome!"
  - text: "No problem at all."

  utter_bot_challenge:
  - text: "I am an AI-powered chatbot designed to assist UPM students with academic enquiries, simulating a real academic advisor."

  utter_ask_drop_course:
  - text: "To drop a course, please log in to your SMP. You can usually drop a course without penalty within the first 2 weeks. If you drop between Week 3 and Week 7, you may be charged a fee."

  utter_ask_course_info:
  - text: "For full course synopsis, please check the 'Course Info' tab in your SMP or refer to the Faculty Handbook."

  utter_ask_registration_deadline:
  - text: "Deadlines vary by semester. Please check the 'NEWS UPDATE' dashboard in your SMP for the latest information regarding registration deadlines."

  utter_ask_exam_schedule:
  - text: "Your personal exam timetable is available in your SMP under 'MySchedule' tab and look for 'STUDENT'S EXAMINATION TIMETABLE' section for more detail information."

  utter_ask_class_full_capacity:
  - text: "I cannot increase class quotas. If a class is full, Please contact the respective lecturer or the Academic Office for assistance."

  utter_ask_timetable_clash:
  - text: "If you have a timetable clash, you must drop one of the courses. System regulations do not allow registering for overlapping courses."

  utter_ask_deferment:
  - text: "To defer a semester, you must apply through the Academic Division before Week 7. You can fill up the deferment application form from the Student Portal (SMP)."

  utter_ask_change_program:
  - text: "Changing programs requires approval from both your current Faculty and the new Faculty. You generally need a CGPA above 2.0. Please visit the Dean's Office to collect the 'Change of Programme' form."

  utter_ask_credit_transfer:
  - text: "Credit transfer applications must be submitted within the first two weeks of your first semester. Please bring your previous transcripts to your Faculty's Academic Office for verification."

  utter_ask_fees_registration_block:
  - text: "If you cannot register due to a financial block, you must clear your outstanding tuition fees. Please check your balance on the SMP under MyFinance or contact the Bursar's office directly."

  utter_ask_system_issues:
  - text: "I cannot fix technical issues directly. If SMP or PutraBlast is down, please contact the UPM iDEC Helpdesk or try resetting your password."

  utter_ask_career_prospects:
  - text: "Graduates from this program often enter careers in Software Engineering, Data Science, and System Administration. UPM's Career Centre also offers resume workshops if you need help."

  utter_ask_industrial_training:
  - text: "Industrial Training (LI) is compulsory for 3rd or 4th-year students. You must register for the LI course code during course registration. Please check the 'Industrial Training' tab on your Faculty website for the company list."

  utter_ask_verification_letter:
  - text: "You can download an official Student Verification Letter directly from the SMP system under the 'Official Letters' tab."

  utter_ask_graduation_criteria:
  - text: "To graduate, you generally need to complete at least 120+ credit hours (depending on your major), maintain a CGPA above 2.0, and pass your FYP and Industrial Training."

  utter_ask_fail_repeat_policy:
  - text: "If you fail a core course (F grade), you MUST repeat it. If you fail an elective, you may replace it with another elective. The new grade will replace the old one in your CGPA calculation, but the 'F' remains on your transcript."

  utter_ask_probation_status:
  - text: "Academic Probation (P1) occurs if your CGPA falls below 2.0. If you remain below 2.0 for consecutive semesters (P2), you risk termination. Please meet your human advisor immediately if you are in this situation."

  utter_ask_muet_requirement:
  - text: "Most programs require a minimum MUET Band 3 to graduate. Please check your specific intake offer letter to confirm if you need a higher band."

  utter_ask_grade_appeal:
  - text: "If you believe there is an error in your final grade, you can appeal within 2 weeks after results are published. Please fill out the Grade Appeal Form available at SMP. There may be an administrative fee for rechecking exam papers."

  utter_ask_elective_options:
  - text: "Elective courses are divided into Faculty Electives and Global Electives. Faculty Electives are specific to your program, while Global Electives can be taken from any faculty. Please check your Faculty Handbook or SMP for the complete list of available electives for your semester."

  utter_ask_exam_regulations:
  - text: "For final exams, you must wear appropriate attire (covered shoes required, no slippers). Make sure to arrive 15 minutes early to avoid from not being allowed to sit for the exam. You also need at least 80% attendance to be eligible to sit for the final exam."

  utter_ask_deans_list:
  - text: "To qualify for the Dean's List (Anugerah Dekan), you must achieve a semester GPA of 3.750 or higher. In addition, to qualify for the Vice Chancellor's List (Anugerah Naib Canselor), you must achieve a semester GPA of 4.000. Recipients may receive certificates and recognition at faculty events."

  utter_ask_convocation:
  - text: "Convocation ceremonies is held once a year (usually in November). You must apply for graduation through SMP and clear all financial obligations. Convocation fees include robe rental and ceremonial costs. Check the UPM website for the exact dates and registration deadlines."

  utter_affirm:
  - text: "Great! How else can I help you?"
  - text: "Okay, noted. What else would you like to know?"

  utter_deny:
  - text: "No problem. Is there anything else I can assist you with?"
  - text: "Alright. Let me know if you need help with something else."

  utter_mood_great:
  - text: "That's wonderful to hear! Keep up the great work with your studies!"
  - text: "Excellent! I'm glad you're doing well. Feel free to ask if you need any academic advice."

  utter_mood_unhappy:
  - text: "I'm sorry to hear that. If you're struggling with academic matters, I'm here to help. For personal concerns, please consider reaching out to UPM's Counselling Division."
  - text: "That's tough. Remember, academic challenges are temporary. If you need support, don't hesitate to contact your academic advisor or counselling services."

  utter_detect_mental_health_crisis:
  - text: "I am an AI advisor and cannot provide medical or emotional support. If you are feeling overwhelmed, please contact the UPM Counselling Division immediately at +603-8946 XXXX. You are not alone."

  utter_ask_course_code:
  - text: "Which course code are you asking about? (e.g., CSC4600)"

actions:
  - action_provide_prerequisite
  - action_provide_course_info

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true