version: "3.1"

intents:
  - ask_prerequisite
  - ask_drop_course
  - ask_course_info
  - ask_registration_deadline
  - ask_exam_schedule
  - ask_class_full_capacity
  - ask_timetable_clash
  - ask_deferment
  - ask_change_program
  - ask_credit_transfer
  - ask_fees_registration_block
  - ask_system_issues
  - ask_career_prospects
  - ask_industrial_training
  - ask_verification_letter
  - ask_graduation_criteria
  - ask_fail_repeat_policy
  - ask_probation_status
  - ask_muet_requirement
  - ask_grade_appeal
  - ask_elective_options
  - ask_exam_regulations
  - ask_deans_list
  - ask_convocation
  - detect_mental_health_crisis
  - greet
  - goodbye
  - thank_you
